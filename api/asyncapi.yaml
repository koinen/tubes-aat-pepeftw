asyncapi: 3.0.0
info:
  title: BNPB Kafka Events
  version: 0.1.0
  description: |
    Pengiriman at-least-once. Consumer wajib idempoten: abaikan pesan bila hazard_id tersebut sudah pernah diproses, karena setiap hazard hanya dipublikasikan sekali.
    Setiap consumer memakai group id sendiri, membaca dari offset earliest, dan commit offset setelah pesan selesai diproses.
defaultContentType: application/json
servers:
  docker:
    host: kafka:9092
    protocol: kafka
    description: Dari dalam container.
  local:
    host: localhost:9094
    protocol: kafka
    description: Dari laptop, hanya untuk pengujian.
channels:
  hazardEvents:
    address: hazard-events
    description: Setiap HazardEvent baru. Data sumber append-only, sehingga hazard tidak pernah diperbarui. Dipublikasikan oleh outbox relay di Aggregator.
    messages:
      HazardMessage:
        $ref: '#/components/messages/HazardMessage'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          retention.ms: 604800000
        bindingVersion: 0.5.0
  authRevocations:
    address: auth-revocations
    description: Access token yang dicabut saat refresh. Dipakai client-api sebagai denylist sampai exp.
    messages:
      RevocationMessage:
        $ref: '#/components/messages/RevocationMessage'
    bindings:
      kafka:
        partitions: 1
        replicas: 1
        topicConfiguration:
          retention.ms: 600000
        bindingVersion: 0.5.0
  fieldReports:
    address: field-reports
    description: Laporan lapangan yang sudah diterima client-api (202). Aggregator menyimpannya sekali per Idempotency-Key; value yang tidak bisa dibaca diparkir sebagai pesan gagal TIM_LAPANGAN.
    messages:
      FieldReportMessage:
        $ref: '#/components/messages/FieldReportMessage'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          retention.ms: 604800000
        bindingVersion: 0.5.0
  unprocessed:
    address: unprocessed
    description: |
      Value dari hazard-events yang tidak bisa dibaca consumer (UTF-8 tidak valid, nesting terlalu dalam, JSON rusak, skema tidak cocok).
      Value diteruskan apa adanya; asal dan alasannya ada di header. Consumer commit offset hazard-events hanya setelah produce ke topic ini berhasil.
      Aggregator memarkirnya sebagai pesan gagal INTERNAL, satu baris per record asal walaupun beberapa consumer group meneruskannya.
    messages:
      UnprocessedMessage:
        $ref: '#/components/messages/UnprocessedMessage'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          retention.ms: 604800000
          max.message.bytes: 2097152
        bindingVersion: 0.5.0
operations:
  publishHazardEvent:
    action: send
    summary: aggregator
    channel:
      $ref: '#/channels/hazardEvents'
  consumeHazardEventDashboard:
    action: receive
    summary: dashboard-updater, group id dashboard-updater
    channel:
      $ref: '#/channels/hazardEvents'
  consumeHazardEventNotifier:
    action: receive
    summary: notifier, group id notifier. Hanya memproses severity SIAGA dan AWAS.
    channel:
      $ref: '#/channels/hazardEvents'
  consumeHazardEventAudit:
    action: receive
    summary: audit, group id audit-log
    channel:
      $ref: '#/channels/hazardEvents'
  publishRevocation:
    action: send
    summary: auth
    channel:
      $ref: '#/channels/authRevocations'
  consumeRevocation:
    action: receive
    summary: client-api, group id client-api-revocations
    channel:
      $ref: '#/channels/authRevocations'
  publishFieldReport:
    action: send
    summary: client-api, POST /field-reports
    channel:
      $ref: '#/channels/fieldReports'
  consumeFieldReport:
    action: receive
    summary: aggregator (setiap pod), group id aggregator-field-reports
    channel:
      $ref: '#/channels/fieldReports'
  forwardUnprocessed:
    action: send
    summary: dashboard-updater, notifier, audit-log; untuk value hazard-events yang tidak bisa dibaca
    channel:
      $ref: '#/channels/unprocessed'
  consumeUnprocessed:
    action: receive
    summary: aggregator (setiap pod), group id aggregator-unprocessed
    channel:
      $ref: '#/channels/unprocessed'
components:
  messages:
    HazardMessage:
      name: HazardMessage
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        type: object
        required: [event_id, event_type, hazard_id, emitted_at, payload]
        properties:
          event_id:
            type: string
            format: uuid
          event_type:
            type: string
            enum: [HAZARD_CREATED]
          hazard_id:
            type: string
            format: uuid
          emitted_at:
            type: string
            format: date-time
          payload:
            $ref: './common.yaml#/components/schemas/HazardEvent'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: hazard_id
          bindingVersion: 0.5.0
    RevocationMessage:
      name: RevocationMessage
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        type: object
        required: [jti, sid, exp, revoked_at]
        properties:
          jti:
            type: string
            format: uuid
          sid:
            type: string
            format: uuid
          exp:
            type: string
            format: date-time
            description: Entri denylist dihapus setelah waktu ini.
          revoked_at:
            type: string
            format: date-time
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: jti
          bindingVersion: 0.5.0
    FieldReportMessage:
      name: FieldReportMessage
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        type: object
        required: [report_id, subject, idempotency_key, accepted_at, report]
        properties:
          report_id:
            type: string
            format: uuid
            description: UUIDv5(namespace tetap, subject + "\x00" + idempotency_key)
          subject: { type: string }
          idempotency_key: { type: string, minLength: 1, maxLength: 128 }
          accepted_at: { type: string, format: date-time }
          correlation_id: { type: string }
          report:
            type: object
            required: [latitude, longitude, reported_at, description]
            properties:
              latitude: { type: number, minimum: -90, maximum: 90 }
              longitude: { type: number, minimum: -180, maximum: 180 }
              reported_at: { type: string, format: date-time }
              description: { type: string, maxLength: 4096 }
              hazard_id: { type: string, format: uuid }
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: report_id
          bindingVersion: 0.5.0
    UnprocessedMessage:
      name: UnprocessedMessage
      headers:
        type: object
        required: [topic, partition, offset, reason, consumer]
        properties:
          topic: { type: string, description: Topic asal, misalnya hazard-events. }
          partition: { type: string, description: Partisi asal, desimal. }
          offset: { type: string, description: Offset asal, desimal. }
          reason:
            type: string
            description: '"<code>: <detail>"; code salah satu invalid_utf8, too_deep, malformed_json, schema_incompatible.'
          consumer: { type: string, description: Group id consumer yang meneruskan. }
          correlation_id: { type: string, description: Disalin dari record asal bila ada. }
          traceparent: { type: string, description: Disalin dari record asal bila ada. }
      payload:
        description: Value record asal, byte per byte. Bisa berupa apa saja, termasuk bukan JSON.
      bindings:
        kafka:
          key:
            description: Key record asal.
          bindingVersion: 0.5.0
  schemas:
    KafkaHeaders:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          type: string
          format: uuid
