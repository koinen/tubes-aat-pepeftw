openapi: 3.1.0
info:
  title: Aggregator Internal API
  version: 0.1.0
  description: |
    Satu-satunya jalur ke Canonical Store. Hanya dipanggil client-api.
    Selalu membaca dari CockroachDB dan tidak pernah memanggil BMKG atau PVMBG pada jalur request.
    Mengembalikan HazardEvent lengkap. Penyaringan field per scope dilakukan client-api.
servers:
  - url: http://localhost:8085
  - url: http://aggregator:8080
security:
  - InternalKey: []
paths:
  /internal/hazards:
    get:
      operationId: listHazards
      description: Diurutkan berdasarkan ingested_at terbaru.
      parameters:
        - $ref: './common.yaml#/components/parameters/CorrelationId'
        - $ref: './common.yaml#/components/parameters/HazardTypeQuery'
        - $ref: './common.yaml#/components/parameters/Since'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: './common.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data, sources, next_cursor, partial, unavailable_units]
                properties:
                  data:
                    type: array
                    items:
                      $ref: './common.yaml#/components/schemas/HazardEvent'
                  sources:
                    $ref: './common.yaml#/components/schemas/SourcesMap'
                  next_cursor:
                    type: [string, 'null']
                    description: null pada halaman terakhir.
                  partial:
                    type: boolean
                    description: true bila sebagian unit penyimpanan tidak terjangkau sehingga daftar bisa belum lengkap.
                  unavailable_units:
                    type: array
                    items:
                      type: string
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /internal/hazards/{hazard_id}:
    get:
      operationId: getHazard
      parameters:
        - $ref: './common.yaml#/components/parameters/CorrelationId'
        - $ref: './common.yaml#/components/parameters/HazardId'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: './common.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: './common.yaml#/components/schemas/HazardEvent'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /internal/analytics:
    get:
      operationId: getAnalytics
      description: |
        Agregasi seluruh HazardEvent lintas 16 unit penyimpanan pada satu snapshot, dipakai analytics-dashboard.
        Kategori TSUNAMI adalah SEISMIC yang memiliki attributes.tsunami_warnings, sisanya mengikuti hazard_type, sehingga setiap kejadian masuk tepat satu kategori.
      parameters:
        - name: from
          in: query
          description: Batas bawah occurred_at (inklusif), bawaan 30 hari lalu.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Batas atas occurred_at (eksklusif), bawaan sekarang.
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          schema: { type: string, enum: [hour, day, month, year], default: day }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [from, to, bucket, total, series, by_severity, by_area, as_of, partial, unavailable_units]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  bucket: { type: string }
                  total: { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket: { type: string, format: date-time }
                        category: { type: string, enum: [SEISMIC, TSUNAMI, VOLCANIC, WILDFIRE, COASTAL] }
                        count: { type: integer }
                  by_severity:
                    type: array
                    items: { type: object, properties: { name: { type: string }, count: { type: integer } } }
                  by_area:
                    type: array
                    items: { type: object, properties: { name: { type: string }, count: { type: integer } } }
                  as_of: { type: string, format: date-time }
                  partial: { type: boolean }
                  unavailable_units: { type: array, items: { type: string } }
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /internal/sources/status:
    get:
      operationId: getSourcesStatus
      parameters:
        - $ref: './common.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: './common.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [BMKG, PVMBG]
                    properties:
                      BMKG:
                        $ref: '#/components/schemas/SourceStatusDetail'
                      PVMBG:
                        $ref: '#/components/schemas/SourceStatusDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /health:
    get:
      operationId: health
      security: []
      description: checks berisi postgres dan kafka.
      responses:
        '200':
          $ref: './common.yaml#/components/responses/Health'
        '503':
          $ref: './common.yaml#/components/responses/HealthUnavailable'
components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Nilai dari env INTERNAL_API_KEY.
  schemas:
    SourceStatusDetail:
      allOf:
        - $ref: './common.yaml#/components/schemas/SourceStatusEntry'
        - type: object
          required: [breaker_state]
          properties:
            breaker_state:
              type: string
              enum: [CLOSED, OPEN, HALF_OPEN]
            last_error:
              type: [string, 'null']
