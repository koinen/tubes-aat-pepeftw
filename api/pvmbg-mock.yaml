openapi: 3.1.0
info:
  title: PVMBG Mock API
  version: 0.1.0
  description: |
    Simulasi PVMBG (gunung api). Field entitas mengikuti spesifikasi M1 dan tidak boleh diubah.
    Delay acak antara PVMBG_DELAY_MIN dan PVMBG_DELAY_MAX (default 500ms dan 3000ms) untuk endpoint data.
    Seed minimal 20 record, minimal 1 laporan baru per 10 detik. Data bersifat append-only.
servers:
  - url: http://localhost:8082
paths:
  /volcanic-reports:
    get:
      operationId: listVolcanicReports
      security:
        - PvmbgToken: []
      parameters:
        - name: since
          in: query
          required: false
          description: RFC 3339 UTC, inklusif. Mengembalikan VolcanicReport dengan reported_at >= since. Tanpa since, mengembalikan semua.
          schema:
            type: string
            format: date-time
      description: |
        Saat outage mode hang, server tidak mengirim respons sama sekali. Saat outage mode error, server langsung menjawab 503.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolcanicReportList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Outage'
  /admin/schema-version:
    post:
      operationId: setSchemaVersion
      security:
        - AdminKey: []
      description: >-
        Berlaku instan tanpa restart dan tetap berfungsi saat outage. Setiap laporan memakai versi yang aktif saat laporan dibuat;
        laporan lama tidak berubah, termasuk saat versi dikembalikan. Versi 1 skema dasar. Versi 2 menambahkan confidence_level
        (perubahan kompatibel). Versi 3 sampai 5 dibangun di atas versi 2 dan merupakan perubahan tidak kompatibel:
        3 mengganti nama alert_level menjadi alert_status, 4 mengirim eruption_count_24h sebagai string (contoh "12"),
        5 menghilangkan field wajib ash_column_height_m.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  enum: [1, 2, 3, 4, 5]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/corrupt:
    post:
      operationId: setCorrupt
      security:
        - AdminKey: []
      description: >-
        Ekstensi admin khusus pengujian (P3 K3), mati secara default. N respons GET /volcanic-reports berikutnya yang lolos
        autentikasi dibalas 200 dengan body rusak, lalu mode ini mati sendiri. truncated memotong respons asli di tengah;
        deep mengirim reports bersarang 10.000 level; invalid_utf8 menyisipkan byte 0xFF 0xFE ke dalam generated_at;
        oversized mengirim JSON valid berukuran 50 MiB secara streaming. Laporan di store tidak berubah, jadi respons
        berikutnya kembali normal. count 0 mematikan mode ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [truncated, deep, invalid_utf8, oversized]
                count:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/outage:
    post:
      operationId: setOutage
      security:
        - AdminKey: []
      description: Berlaku instan. Durasi outage dikendalikan penuh oleh operator. Tetap berfungsi saat outage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                mode:
                  type: string
                  enum: [hang, error]
                  default: hang
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Outage aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    PvmbgToken:
      type: http
      scheme: bearer
      bearerFormat: pvmbg.<client_id>.<hmac>
      description: |
        Token terstruktur. hmac = HMAC-SHA256(PVMBG_TOKEN_SECRET, client_id) dalam base64url.
        Mock memegang PVMBG_TOKEN_SECRET. Aggregator hanya memegang token jadi di env PVMBG_TOKEN.
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Nilai dari env PVMBG_ADMIN_KEY. Terpisah dari token akses data.
  schemas:
    VolcanicReport:
      type: object
      required: [report_id, volcano_id, alert_level, eruption_count_24h, ash_column_height_m, reported_at]
      properties:
        report_id:
          type: string
        volcano_id:
          type: string
          description: Kode gunung api. Daftar kode disepakati dengan tabel referensi VolcanoRef di Aggregator.
        alert_level:
          type: string
          enum: [Normal, Waspada, Siaga, Awas]
        eruption_count_24h:
          type: integer
          minimum: 0
        ash_column_height_m:
          type: number
          format: double
        reported_at:
          type: string
          format: date-time
        confidence_level:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Hanya ada pada laporan yang dibuat saat schema version 2 aktif.
    VolcanicReportList:
      type: object
      required: [reports, generated_at]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/VolcanicReport'
        generated_at:
          type: string
          format: date-time
    AdminState:
      type: object
      required: [schema_version, schema_mode, outage, corrupt]
      properties:
        schema_version:
          type: integer
          enum: [1, 2, 3, 4, 5]
        schema_mode:
          type: string
          enum: [base, additive_optional_field, rename_field, type_change, missing_required_field]
        outage:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            mode:
              type: string
              enum: [hang, error]
        corrupt:
          type: object
          required: [remaining]
          properties:
            kind:
              type: string
              enum: [truncated, deep, invalid_utf8, oversized]
            remaining:
              type: integer
              minimum: 0
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, UPSTREAM_UNAVAILABLE]
            message:
              type: string
            correlation_id:
              type: string
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, outage]
        service:
          type: string
  responses:
    BadRequest:
      description: Parameter atau body tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Kredensial tidak ada, formatnya salah, atau tanda tangannya tidak cocok.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Kredensial milik instansi lain, misalnya X-BMKG-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Outage:
      description: Outage aktif dengan mode error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
