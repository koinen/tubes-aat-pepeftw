apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: crdb
    count: 4
  - name: aggregator
    count: 3
  - name: kafka
    count: 1
  - name: client-api
    count: 1
  - name: auth
    count: 1
patches:
  - path: kafka-config.yaml
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
