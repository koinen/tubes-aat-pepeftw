apiVersion: v1
kind: Service
metadata:
  name: crdb-headless
  labels:
    app: crdb
    bnpb.io/stage: infra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: crdb
  ports:
    - name: grpc
      port: 26257
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: crdb-public
  labels:
    app: crdb
    role: store
    bnpb.io/stage: infra
spec:
  selector:
    app: crdb
  ports:
    - name: sql
      port: 26257
    - name: http
      port: 8080
