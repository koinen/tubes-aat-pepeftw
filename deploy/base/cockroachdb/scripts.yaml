apiVersion: v1
kind: ConfigMap
metadata:
  name: crdb-scripts
  labels:
    bnpb.io/stage: infra
data:
  init.sh: |
    set -e
    crdb=/cockroach/cockroach
    until "$crdb" init --insecure --host="$CRDB_INIT_HOST" > /tmp/init.log 2>&1 || grep -q "already been initialized" /tmp/init.log
    do
      cat /tmp/init.log
      echo "waiting for $CRDB_INIT_HOST"
      sleep 3
    done
    sql() {
      "$crdb" sql --insecure --host="$CRDB_SQL_HOST" -e "$1"
    }
    sql "CREATE DATABASE IF NOT EXISTS ${DB_NAME}"
    sql "CREATE USER IF NOT EXISTS ${DB_USER}"
    sql "GRANT ALL ON DATABASE ${DB_NAME} TO ${DB_USER}"
    sql "GRANT ALL ON SCHEMA ${DB_NAME}.public TO ${DB_USER}"
