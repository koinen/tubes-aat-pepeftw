apiVersion: batch/v1
kind: Job
metadata:
  name: crdb-init
  labels:
    app: crdb-init
    bnpb.io/stage: init
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: crdb-init
        role: other
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: init
          image: cockroachdb/cockroach:v24.2.4
          command: ["/bin/sh", "/opt/bnpb/init.sh"]
          env:
            - name: CRDB_INIT_HOST
              value: crdb-0.crdb-headless:26257
            - name: CRDB_SQL_HOST
              value: crdb-public:26257
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: aggregator-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: aggregator-config
                  key: DB_NAME
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /opt/bnpb
      volumes:
        - name: scripts
          configMap:
            name: crdb-scripts
