apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dashboard
  labels:
    app: analytics-dashboard
    bnpb.io/stage: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-dashboard
  template:
    metadata:
      labels:
        app: analytics-dashboard
        role: api
    spec:
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      containers:
        - name: analytics-dashboard
          image: bnpb/analytics-dashboard:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: analytics-dashboard-config
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: INTERNAL_API_KEY
          readinessProbe:
            timeoutSeconds: 3
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            timeoutSeconds: 5
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
