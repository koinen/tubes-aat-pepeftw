apiVersion: v1
kind: ConfigMap
metadata:
  name: aggregator-config
  labels:
    app: aggregator
    bnpb.io/stage: infra
data:
  PORT: "8080"
  DB_HOST: "crdb-public"
  DB_PORT: "26257"
  DB_USER: "aat"
  DB_NAME: "aggregator"
  POLLER_ENABLED: "true"
  BMKG_URL: "http://bmkg-mock:8080"
  PVMBG_URL: "http://pvmbg-mock:8080"
  POLL_INTERVAL: "3s"
  BMKG_TIMEOUT: "1s"
  PVMBG_TIMEOUT: "4s"
  POLL_CURSOR_OVERLAP: "1m"
  BREAKER_FAILURES: "3"
  BREAKER_OPEN_FOR: "15s"
  TSUNAMI_GRACE: "30s"
