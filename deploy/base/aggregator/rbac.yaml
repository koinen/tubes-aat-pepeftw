apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator
  labels:
    app: aggregator
    bnpb.io/stage: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-leases
  labels:
    app: aggregator
    bnpb.io/stage: apps
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-leases
  labels:
    app: aggregator
    bnpb.io/stage: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aggregator-leases
subjects:
  - kind: ServiceAccount
    name: aggregator
