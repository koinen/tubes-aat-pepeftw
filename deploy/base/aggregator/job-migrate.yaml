apiVersion: batch/v1
kind: Job
metadata:
  name: aggregator-migrate
  labels:
    app: aggregator-migrate
    bnpb.io/stage: migrate
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: aggregator-migrate
        role: other
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: bnpb/aggregator:TAG
          imagePullPolicy: IfNotPresent
          command: ["./aggregator", "migrate"]
          envFrom:
            - configMapRef:
                name: aggregator-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
