apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app: kafka-topics
    bnpb.io/stage: init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: kafka-topics
        role: other
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.3.1
          command: ["/bin/sh", "/opt/bnpb/topics.sh"]
          envFrom:
            - configMapRef:
                name: bnpb-common
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xmx128M
            - name: TOPIC_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: TOPIC_REPLICATION_FACTOR
            - name: TOPIC_MIN_INSYNC_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: TOPIC_MIN_INSYNC_REPLICAS
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /opt/bnpb
      volumes:
        - name: scripts
          configMap:
            name: kafka-scripts
