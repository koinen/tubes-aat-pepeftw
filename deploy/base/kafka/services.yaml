apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app: kafka
    bnpb.io/stage: infra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    role: broker
    bnpb.io/stage: infra
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
