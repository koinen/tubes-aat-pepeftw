apiVersion: v1
kind: ConfigMap
metadata:
  name: pvmbg-mock-config
  labels:
    app: pvmbg-mock
    bnpb.io/stage: apps
data:
  PORT: "8080"
  PVMBG_DELAY_MIN: "500ms"
  PVMBG_DELAY_MAX: "3000ms"
  PVMBG_REPORT_INTERVAL: "5s"
  PVMBG_SEED_COUNT: "25"
  PVMBG_SCHEMA_VERSION: "1"
  PVMBG_HANG_MAX: "5m"
