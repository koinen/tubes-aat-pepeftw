apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensor-pantai-aggregator-only
  labels:
    app: sensor-pantai
    bnpb.io/stage: sensor
spec:
  podSelector:
    matchLabels:
      app: sensor-pantai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aggregator
      ports:
        - port: 8080
