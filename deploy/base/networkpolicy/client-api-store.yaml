apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-api-store-owner-only
  labels:
    app: client-api-store
    bnpb.io/stage: infra
spec:
  podSelector:
    matchLabels:
      app: client-api-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client-api
      ports:
        - port: 6379
