apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-store-owner-only
  labels:
    app: auth-store
    bnpb.io/stage: infra
spec:
  podSelector:
    matchLabels:
      app: auth-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth
      ports:
        - port: 6379
