apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crdb-owner-only
  labels:
    app: crdb
    bnpb.io/stage: infra
spec:
  podSelector:
    matchLabels:
      app: crdb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aggregator
        - podSelector:
            matchLabels:
              app: aggregator-migrate
        - podSelector:
            matchLabels:
              app: crdb-init
        - podSelector:
            matchLabels:
              app: crdb
      ports:
        - port: 26257
        - port: 8080
