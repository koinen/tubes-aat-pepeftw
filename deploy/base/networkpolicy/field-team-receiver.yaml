apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: field-team-receiver
  labels:
    bnpb.io/stage: apps
spec:
  podSelector:
    matchLabels:
      app: field-team-receiver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notifier
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
