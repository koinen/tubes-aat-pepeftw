apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    bnpb.io/stage: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        role: api
    spec:
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      containers:
        - name: auth
          image: bnpb/auth:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-config
            - configMapRef:
                name: bnpb-common
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: REDIS_PASSWORD
            - name: MEDIA_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: MEDIA_SECRET
            - name: LAPANGAN_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: LAPANGAN_SECRET
            - name: BNPB_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: BNPB_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: auth-keys
