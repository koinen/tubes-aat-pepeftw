apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  labels:
    app: auth
    bnpb.io/stage: apps
data:
  SERVER_PORT: "8080"
  REDIS_HOST: "auth-store"
  REDIS_PORT: "6379"
  KAFKA_TOPIC: "auth-revocations"
  PRIVATE_KEY_PATH: "/app/secrets/auth_priv.pem"
  PUBLIC_KEY_PATH: "/app/secrets/auth_pub.pem"
  JWT_ISSUER: "auth-service"
  JWT_AUDIENCE: "bnpb-ops"
  ACCESS_TOKEN_TTL: "60"
  REFRESH_TOKEN_TTL: "1800"
