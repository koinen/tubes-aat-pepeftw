apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg-mock
  labels:
    app: bmkg-mock
    bnpb.io/stage: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bmkg-mock
  template:
    metadata:
      labels:
        app: bmkg-mock
        role: mock
    spec:
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      containers:
        - name: bmkg-mock
          image: bnpb/bmkg-mock:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bmkg-mock-config
            - configMapRef:
                name: bnpb-common
          env:
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: BMKG_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
