apiVersion: v1
kind: ConfigMap
metadata:
  name: client-api-config
  labels:
    app: client-api
    bnpb.io/stage: apps
data:
  PORT: "8080"
  REDIS_HOST: "client-api-store"
  REDIS_PORT: "6379"
  AGGREGATOR_URL: "http://aggregator:8080"
  AUTH_JWKS_URL: "http://auth:8080/.well-known/jwks.json"
  JWT_ISSUER: "auth-service"
  JWT_AUDIENCE: "bnpb-ops"
  RATE_LIMIT_MAX: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  MAX_CONCURRENT_REQUESTS: "200"
