apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api
  labels:
    app: client-api
    bnpb.io/stage: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-api
  template:
    metadata:
      labels:
        app: client-api
        role: api
    spec:
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      containers:
        - name: client-api
          image: bnpb/client-api:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: client-api-config
            - configMapRef:
                name: bnpb-common
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: REDIS_PASSWORD
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: INTERNAL_API_KEY
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_GROUP_ID
              value: "client-api-revocations-$(POD_NAME)"
          readinessProbe:
            timeoutSeconds: 3
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            timeoutSeconds: 5
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
