apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api-store
  labels:
    app: client-api-store
    bnpb.io/stage: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: client-api-store
  template:
    metadata:
      labels:
        app: client-api-store
        role: store
    spec:
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      containers:
        - name: redis
          image: redis:8.10.2
          command: ["redis-server"]
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            timeoutSeconds: 3
            tcpSocket:
              port: 6379
          livenessProbe:
            timeoutSeconds: 5
            tcpSocket:
              port: 6379
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/bnpb/client-api-store
            type: DirectoryOrCreate
