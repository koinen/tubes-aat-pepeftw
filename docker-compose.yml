services:
  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - aggregator_db_data:/var/lib/postgresql/data
      - ./cmd/aggregator/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - store-net

  client-api-store:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - client-api-store-net

  client-api:
    build:
      context: .
      dockerfile: ./cmd/client-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_HOST: client-api-store
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_AUTH_REVOCATIONS: ${KAFKA_TOPIC_AUTH_REVOCATIONS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_CLIENT_API_REVOCATIONS}
      AGGREGATOR_URL: http://aggregator:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      - client-api-store
      - kafka
      - auth
      - aggregator
    restart: unless-stopped
    networks:
      - default
      - client-api-store-net

  auth-store:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - auth-store-net

  auth:
    build:
      context: .
      dockerfile: ./cmd/auth/Dockerfile
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: "8080"
      REDIS_HOST: auth-store
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC_AUTH_REVOCATIONS}
      PRIVATE_KEY_PATH: /app/secrets/auth_priv.pem
      PUBLIC_KEY_PATH: /app/secrets/auth_pub.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-60}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-1800}
      MEDIA_SECRET: ${MEDIA_SECRET}
      LAPANGAN_SECRET: ${LAPANGAN_SECRET}
      BNPB_SECRET: ${BNPB_SECRET}
    depends_on:
      - auth-store
      - kafka
    restart: unless-stopped
    networks:
      - default
      - auth-store-net
    volumes:
      - ./secrets:/app/secrets:ro
  
  aggregator:
    build:
      context: .
      dockerfile: ./cmd/aggregator/Dockerfile
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SEED_FIXTURES: ${SEED_FIXTURES:-true}
      DB_HOST: aggregator-db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_HAZARD_EVENTS: ${KAFKA_TOPIC_HAZARD_EVENTS}
      POLLER_ENABLED: ${POLLER_ENABLED:-true}
      BMKG_URL: http://bmkg-mock:8080
      BMKG_API_KEY: ${BMKG_API_KEY}
      PVMBG_URL: http://pvmbg-mock:8080
      PVMBG_TOKEN: ${PVMBG_TOKEN}
      POLL_INTERVAL: ${POLL_INTERVAL:-3s}
      BMKG_TIMEOUT: ${BMKG_TIMEOUT:-1s}
      PVMBG_TIMEOUT: ${PVMBG_TIMEOUT:-4s}
      POLL_CURSOR_OVERLAP: ${POLL_CURSOR_OVERLAP:-1m}
      BREAKER_FAILURES: ${BREAKER_FAILURES:-3}
      BREAKER_OPEN_FOR: ${BREAKER_OPEN_FOR:-15s}
      TSUNAMI_GRACE: ${TSUNAMI_GRACE:-30s}
    ports:
      - "8085:8080"
    depends_on:
      aggregator-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - store-net

  dashboard-updater:
    build:
      context: .
      dockerfile: ./cmd/dashboard-updater/Dockerfile
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_HAZARD_EVENTS: ${KAFKA_TOPIC_HAZARD_EVENTS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_DASHBOARD}
    ports:
      - "8083:8080"
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: ./cmd/notifier/Dockerfile
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_HAZARD_EVENTS: ${KAFKA_TOPIC_HAZARD_EVENTS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_NOTIFIER}
    restart: unless-stopped

  audit-log:
    build:
      context: .
      dockerfile: ./cmd/audit-log/Dockerfile
    profiles: ["extra"]
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_HAZARD_EVENTS: ${KAFKA_TOPIC_HAZARD_EVENTS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_AUDIT}
    restart: unless-stopped

  pvmbg-mock:
    build:
      context: .
      dockerfile: ./cmd/pvmbg-mock/Dockerfile
    ports:
      - "8082:8080"
    environment:
      PVMBG_TOKEN_SECRET: ${PVMBG_TOKEN_SECRET}
      PVMBG_ADMIN_KEY: ${PVMBG_ADMIN_KEY}
      PVMBG_DELAY_MIN: ${PVMBG_DELAY_MIN:-500ms}
      PVMBG_DELAY_MAX: ${PVMBG_DELAY_MAX:-3000ms}
      PVMBG_REPORT_INTERVAL: ${PVMBG_REPORT_INTERVAL:-5s}
      PVMBG_SEED_COUNT: ${PVMBG_SEED_COUNT:-25}
      PVMBG_SCHEMA_VERSION: ${PVMBG_SCHEMA_VERSION:-1}
      PVMBG_HANG_MAX: ${PVMBG_HANG_MAX:-5m}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  bmkg-mock:
    build:
      context: .
      dockerfile: ./cmd/bmkg-mock/Dockerfile
    ports:
      - "8081:8080"
    environment:
      BMKG_API_KEY: ${BMKG_API_KEY}
      BMKG_DELAY_MIN: ${BMKG_DELAY_MIN:-50ms}
      BMKG_DELAY_MAX: ${BMKG_DELAY_MAX:-150ms}
      BMKG_EVENT_INTERVAL: ${BMKG_EVENT_INTERVAL:-5s}
      BMKG_SEED_COUNT: ${BMKG_SEED_COUNT:-25}
      BMKG_TSUNAMI_RATE: ${BMKG_TSUNAMI_RATE:-0.15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    ports:
      - "9094:9094" # local testing only
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic hazard-events --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic auth-revocations --partitions 1 --replication-factor 1 --config retention.ms=600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --describe
    restart: "no"

volumes:
  aggregator_db_data:
  kafka_data:
networks:
  store-net:
  auth-store-net:
  client-api-store-net: