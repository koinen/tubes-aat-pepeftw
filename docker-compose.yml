services:
  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - aggregator_db_data:/var/lib/postgresql/data
      - ./cmd/aggregator/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - store-net

  client-api:
    build:
      context: .
      dockerfile: ./cmd/client-api/Dockerfile
    ports:
      - "8080:8080"

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - auth-store-net

  auth:
    build:
      context: .
      dockerfile: ./cmd/auth/Dockerfile
    ports:
      - "8084:8080"
    depends_on:
      - auth-db
    networks:
      - default
      - auth-store-net
  
  aggregator:
    build:
      context: .
      dockerfile: ./cmd/aggregator/Dockerfile
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SEED_FIXTURES: ${SEED_FIXTURES:-true}
      DB_HOST: aggregator-db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_HAZARD_EVENTS: ${KAFKA_TOPIC_HAZARD_EVENTS}
    ports:
      - "8085:8080"
    depends_on:
      aggregator-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - store-net


  dashboard-updater:
    build:
      context: .
      dockerfile: ./cmd/dashboard-updater/Dockerfile
    ports:
      - "8083:8080"
  
  pvmbg-mock:
    build:
      context: .
      dockerfile: ./cmd/pvmbg-mock/Dockerfile
    ports:
      - "8082:8080"
  
  bmkg-mock:
    build:
      context: .
      dockerfile: ./cmd/bmkg-mock/Dockerfile
    ports:
      - "8081:8080"

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    ports:
      - "9094:9094" # local testing only
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic hazard-events --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic auth-revocations --partitions 1 --replication-factor 1 --config retention.ms=600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --describe
    restart: "no"

volumes:
  aggregator_db_data:
  auth_db_data:
  kafka_data:

networks:
  store-net:
  auth-store-net: